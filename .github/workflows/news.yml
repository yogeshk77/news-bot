name: news-bot
on:
  schedule:
    - cron: "0 * * * *"  # backup restart; the loop below re-triggers itself every 5 min
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: news-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - if: always()
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add seen.json && (git commit -m "state" && git push) || true
      - if: always()
        run: sleep 270
      - if: always()
        run: gh workflow run news.yml
        env:
          GH_TOKEN: ${{ github.token }}
